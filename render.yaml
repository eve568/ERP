services:
  - type: web
    name: erp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: CORS_ORIGIN
        fromService:
          name: erp-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: erp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build:web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          name: erp-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
